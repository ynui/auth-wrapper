<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="particles-canvas"></canvas>
    <div class="container">
        <div class="card">
            <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
                <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
                </svg>
                <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                </svg>
            </button>
            <div class="logo">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                    <path d="M2 17l10 5 10-5"/>
                    <path d="M2 12l10 5 10-5"/>
                </svg>
            </div>
            <h1>Create Account</h1>
            <p class="subtitle">Sign up to get started</p>

            <form id="signupForm" novalidate>
                <div class="form-group floating-label">
                    <input type="email" id="email" name="email" autocomplete="email" placeholder=" ">
                    <label for="email">Email</label>
                    <span class="validation-icon"></span>
                </div>

                <div class="form-group floating-label">
                    <input type="text" id="name" name="name" autocomplete="name" maxlength="100" placeholder=" ">
                    <label for="name">Name</label>
                    <span class="validation-icon"></span>
                </div>

                <div class="form-group floating-label">
                    <input type="password" id="password" name="password" autocomplete="new-password" placeholder=" ">
                    <label for="password">Password</label>
                    <button type="button" class="password-toggle" tabindex="-1" aria-label="Toggle password visibility">
                        <svg class="icon-eye" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                        <svg class="icon-eye-off" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                            <line x1="1" y1="1" x2="23" y2="23"/>
                        </svg>
                    </button>
                    <span class="validation-icon"></span>
                </div>

                <div class="form-group floating-label">
                    <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" placeholder=" ">
                    <label for="confirmPassword">Confirm Password</label>
                    <span class="validation-icon"></span>
                </div>

                <div id="message" class="message"></div>

                <button type="submit" id="submitBtn">
                    <span class="btn-text">Create Account</span>
                    <span class="spinner"></span>
                </button>
            </form>

            <!-- <p class="footer">Already have an account? <a href="#">Sign in</a></p> -->
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
