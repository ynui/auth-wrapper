<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Created</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .success-page {
            text-align: center;
        }
        .success-page h1 {
            margin-bottom: 1rem;
        }
        .success-page p {
            color: var(--text-muted);
            font-size: 1.05rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card success-page">
            <div class="logo">
                <svg class="success-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                    <polyline points="22 4 12 14.01 9 11.01"/>
                </svg>
            </div>
            <h1 id="greeting">Account Created!</h1>
            <p>Your account has been created successfully.</p>
        </div>
    </div>
    <script src="script.js"></script>
    <script>
        const firstName = sessionStorage.getItem('signupFirstName');
        if (firstName) {
            document.getElementById('greeting').textContent = 'Welcome, ' + firstName + '!';
            sessionStorage.removeItem('signupFirstName');
        }
    </script>
</body>
</html>
